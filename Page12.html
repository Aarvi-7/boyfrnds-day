<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Last Reel ♡</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 20%, rgba(255, 120, 190, 0.14), transparent 35%),
                #09070a;

            color: #f8e8f0;
            font-family: 'DM Mono', monospace;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }

        .page {
            width: min(900px, 100%);
            text-align: center;
        }

        .small {
            font-size: 10px;
            letter-spacing: 4px;
            color: #9c7f8e;
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(42px, 9vw, 75px);
            font-weight: 500;
            color: #ffd5e7;

            text-shadow:
                0 0 25px rgba(255, 130, 190, 0.25);

            margin-bottom: 12px;
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 18px;
            color: #c9aeba;
            margin-bottom: 35px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;

            border: 1px solid rgba(255, 180, 215, 0.35);

            padding: 8px;

            background: rgba(255, 255, 255, 0.025);

            box-shadow:
                0 0 45px rgba(255, 90, 170, 0.12),
                0 0 100px rgba(150, 80, 180, 0.06);
        }

        video {
            display: block;
            width: 100%;
            max-height: 70vh;

            background: black;

            object-fit: contain;
        }

        .caption {
            margin-top: 30px;

            font-family: 'Playfair Display', serif;
            font-style: italic;

            font-size: 22px;
            color: #f3cbdc;
        }

        .message {
            margin-top: 12px;

            font-size: 11px;
            line-height: 1.8;

            color: #88717e;
        }

        .heart {
            margin-top: 25px;

            font-size: 25px;
            color: #ff9fc8;

            text-shadow:
                0 0 15px rgba(255, 120, 190, 0.4);
        }

        .footer {
            margin-top: 35px;

            font-size: 9px;
            letter-spacing: 3px;

            color: #5f4b56;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .video-wrapper {
                padding: 5px;
            }

            .caption {
                font-size: 19px;
            }

        }
    </style>
</head>

<body>

    <main class="page">

        <p class="small">
            FINAL MEMORY · FILE 12
        </p>

        <h1>
            The Last Reel
        </h1>

        <p class="subtitle">
            Some memories are easier to show than to say. ♡
        </p>


        <div class="video-wrapper">

            <video controls playsinline preload="metadata">

                <source src="77219d49a81f449eb10b4b23e566f4cd%203.mp4" type="video/mp4">

                Your browser does not support the video.

            </video>

        </div>


        <p class="caption">
            A little something I wanted you to have. ♡
        </p>

        <p class="message">
            No big speech.<br>
            No expectations.<br>
            Just a memory.
        </p>

        <div class="heart">
            ♡
        </div>

        <p class="footer">
            MADE WITH LOVE · R
        </p>

    </main>

</body>
</html>
