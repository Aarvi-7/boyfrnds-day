<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Frequency ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, rgba(255, 105, 180, 0.20), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(170, 120, 255, 0.20), transparent 30%),
        linear-gradient(135deg, #100713, #1b0b1d, #0b0712);

    color: #ffeaf4;
    font-family: 'DM Mono', monospace;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
}

/* FLOATING HEARTS */

.heart {
    position: fixed;
    color: rgba(255, 150, 200, 0.5);
    font-size: 20px;
    animation: float 7s infinite ease-in-out;
    pointer-events: none;
}

.h1 { top: 10%; left: 10%; }
.h2 { top: 25%; right: 12%; animation-delay: 2s; }
.h3 { bottom: 15%; left: 18%; animation-delay: 4s; }
.h4 { bottom: 25%; right: 20%; animation-delay: 1s; }

@keyframes float {
    0%,100% {
        transform: translateY(0) rotate(0deg);
        opacity: .3;
    }

    50% {
        transform: translateY(-25px) rotate(10deg);
        opacity: .8;
    }
}

/* MAIN CARD */

.container {
    width: 90%;
    max-width: 720px;

    padding: 55px 35px;

    text-align: center;

    background: rgba(30, 12, 28, 0.78);

    border: 1px solid rgba(255, 160, 205, 0.35);

    border-radius: 25px;

    box-shadow:
        0 0 40px rgba(255, 80, 160, 0.15),
        inset 0 0 40px rgba(180, 100, 255, 0.05);

    backdrop-filter: blur(12px);

    position: relative;
}

/* TOP */

.small {
    font-size: 11px;
    letter-spacing: 4px;
    color: #dba6ff;
    margin-bottom: 18px;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(38px, 8vw, 65px);
    font-weight: 400;
    font-style: italic;

    background: linear-gradient(
        90deg,
        #ff9acb,
        #ffd2e7,
        #c9a7ff
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    margin-bottom: 15px;
}

.subtitle {
    color: #e9bfd4;
    font-size: 13px;
    letter-spacing: 2px;
}

/* RADIO */

.radio {
    margin: 45px auto 30px;

    padding: 25px;

    border-radius: 18px;

    background: rgba(10, 5, 15, 0.65);

    border: 1px solid rgba(255, 130, 190, 0.25);

    box-shadow:
        0 0 25px rgba(255, 100, 180, 0.12);
}

.frequency {
    color: #ff9acb;
    font-size: 14px;
    letter-spacing: 5px;
    margin-bottom: 18px;
}

.wave {
    height: 55px;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
}

.wave span {
    width: 3px;

    background: linear-gradient(
        to top,
        #ff73ae,
        #c49aff
    );

    border-radius: 10px;

    animation: pulse 1s infinite ease-in-out;
}

.wave span:nth-child(1) { height: 15px; animation-delay: .1s; }
.wave span:nth-child(2) { height: 30px; animation-delay: .2s; }
.wave span:nth-child(3) { height: 45px; animation-delay: .3s; }
.wave span:nth-child(4) { height: 25px; animation-delay: .4s; }
.wave span:nth-child(5) { height: 50px; animation-delay: .5s; }
.wave span:nth-child(6) { height: 35px; animation-delay: .6s; }
.wave span:nth-child(7) { height: 55px; animation-delay: .7s; }
.wave span:nth-child(8) { height: 28px; animation-delay: .8s; }
.wave span:nth-child(9) { height: 48px; animation-delay: .9s; }
.wave span:nth-child(10) { height: 20px; animation-delay: 1s; }
.wave span:nth-child(11) { height: 40px; animation-delay: 1.1s; }
.wave span:nth-child(12) { height: 25px; animation-delay: 1.2s; }
.wave span:nth-child(13) { height: 50px; animation-delay: 1.3s; }

@keyframes pulse {
    0%,100% {
        transform: scaleY(.6);
        opacity: .6;
    }

    50% {
        transform: scaleY(1.2);
        opacity: 1;
    }
}

/* MESSAGE */

.message {
    margin: 30px auto;

    max-width: 520px;

    font-family: 'Playfair Display', serif;

    font-size: 21px;

    line-height: 1.8;

    font-style: italic;

    color: #ffe4ef;
}

.message span {
    color: #ff9dcc;
}

/* BUTTON */

.next-btn {
    display: inline-block;

    margin-top: 25px;

    padding: 15px 30px;

    border-radius: 30px;

    border: 1px solid #ff91bd;

    background: linear-gradient(
        135deg,
        rgba(255, 100, 170, .18),
        rgba(170, 110, 255, .18)
    );

    color: #ffd9e9;

    text-decoration: none;

    font-size: 11px;

    letter-spacing: 2px;

    transition: .3s;

    box-shadow:
        0 0 20px rgba(255, 100, 170, .2);
}

.next-btn:hover {
    transform: scale(1.06);

    background: rgba(255, 120, 180, .3);

    box-shadow:
        0 0 35px rgba(255, 100, 180, .5);
}

/* BOTTOM */

.footer {
    margin-top: 30px;

    font-size: 9px;

    letter-spacing: 3px;

    color: #a889a0;
}

@media(max-width:600px) {

    .container {
        padding: 40px 20px;
    }

    .message {
        font-size: 18px;
    }

    .frequency {
        letter-spacing: 3px;
    }
}
</style>
</head>

<body>

<div class="heart h1">♡</div>
<div class="heart h2">✦</div>
<div class="heart h3">♡</div>
<div class="heart h4">✧</div>

<div class="container">

    <div class="small">
        TRANSMISSION 07
    </div>

    <h1>The Frequency</h1>

    <div class="subtitle">
        20.07 FM · SOMEWHERE BETWEEN US
    </div>

    <div class="radio">

        <div class="frequency">
            ♡ 20.07 FM ♡
        </div>

        <div class="wave">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <div class="message">

        "Somehow, through all the noise,
        <span>I still found my way back to you.</span>"

        <br><br>

        Maybe that's what makes certain people
        impossible to forget. ♡

    </div>

    <a href="./page8.html" class="next-btn">
        CHANGE FREQUENCY →
    </a>

    <div class="footer">
        SIGNAL FOUND · CONNECTION STABLE · ♡
    </div>

</div>

</body>
</html>
