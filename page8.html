<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Universe ♡</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(circle at 30% 20%, #492052 0%, transparent 25%),
        radial-gradient(circle at 75% 70%, #341947 0%, transparent 30%),
        linear-gradient(135deg, #09050d, #180918, #0b0612);

    color: white;

    overflow: hidden;

    font-family: 'Playfair Display', serif;

}

.title {

    text-align: center;

    padding-top: 55px;

    font-size: 42px;

    font-style: italic;

    color: #ffd9eb;

    text-shadow:
        0 0 15px #ff8fc4,
        0 0 35px rgba(255,120,190,.5);

}

.subtitle {

    text-align: center;

    margin-top: 10px;

    color: #cdb4d8;

    font-size: 14px;

    letter-spacing: 2px;

}

/* STARS */

.star {

    position: absolute;

    color: #fff0f8;

    font-size: 25px;

    cursor: pointer;

    transition: .3s;

    animation: twinkle 2s infinite alternate;

    text-shadow:
        0 0 8px #ffb4d7,
        0 0 20px #ff8fc4;

}

.star:hover {

    transform: scale(1.6);

    color: #ffb5d8;

}

.s1 { top: 25%; left: 18%; }
.s2 { top: 38%; right: 20%; }
.s3 { top: 55%; left: 30%; }
.s4 { top: 68%; right: 30%; }

@keyframes twinkle {

    from {
        opacity: .4;
    }

    to {
        opacity: 1;
    }

}

/* MESSAGE */

.message {

    position: fixed;

    left: 50%;
    bottom: 14%;

    transform: translateX(-50%);

    width: 80%;
    max-width: 500px;

    text-align: center;

    font-size: 20px;

    line-height: 1.7;

    font-style: italic;

    color: #ffe6f1;

    opacity: 0;

    transition: .5s;

}

.message.show {

    opacity: 1;

}

/* NEXT */

.next {

    position: fixed;

    bottom: 35px;

    left: 0;

    right: 0;

    text-align: center;

    opacity: 0;

    pointer-events: none;

    transition: .5s;

}

.next.show {

    opacity: 1;

    pointer-events: auto;

}

.next a {

    display: inline-block;

    padding: 14px 28px;

    border: 1px solid #ff9bc7;

    border-radius: 30px;

    color: #ffdceb;

    text-decoration: none;

    font-size: 11px;

    letter-spacing: 2px;

    background: rgba(255,100,170,.1);

    box-shadow: 0 0 20px rgba(255,100,170,.2);

}

</style>

</head>

<body>

<h1 class="title">
    Our Little Universe ♡
</h1>

<div class="subtitle">
    tap the stars
</div>

<div class="star s1" onclick="showMessage(1)">✦</div>
<div class="star s2" onclick="showMessage(2)">✦</div>
<div class="star s3" onclick="showMessage(3)">✦</div>
<div class="star s4" onclick="showMessage(4)">✦</div>

<div id="message" class="message"></div>

<div class="next" id="next">

    <a href="./page9.html">
        THE NEXT MEMORY →
    </a>

</div>

<script>

let clicked = 0;

const messages = {

    1: "I still remember the little things. ♡",

    2: "You made ordinary days feel different.",

    3: "I miss our stupid little conversations.",

    4: "You were never just another person to me. ♡"

};

function showMessage(number) {

    document.getElementById("message").innerText =
        messages[number];

    document.getElementById("message")
        .classList.add("show");

    clicked++;

    if (clicked >= 4) {

        document.getElementById("next")
            .classList.add("show");

    }

}

</script>

</body>
</html>
